          # payload replaced; schema migrations run over retained data
          ./3rdparty/python-runtime/python/bin/python \
            -m testorchestrator db-upgrade
          cp "$GITHUB_WORKSPACE/packaging/ci/report_serving_check.py" .
          ./3rdparty/python-runtime/python/bin/python \
            report_serving_check.py check
          echo "PASS retained reports/licence/access after v2.0.0->candidate upgrade"

