name: linux-package
on: {push: {branches: [main]}, pull_request: {}, workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: nsis (system prerequisite for the worker installer)
        run: sudo apt-get install -y --no-install-recommends nsis
      - name: one-command release build
        run: python3 build-scripts/build_linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: testorchestrator-linux-package
          path: |
            dist/release/linux/*.tar.gz
            dist/release/linux/*.run
            dist/release/linux/SHA256SUMS.txt
            dist/release/linux/build-manifest.json
            dist/testorchestrator-*-linux-x86_64.manifest.json
          retention-days: 14

  installer-validate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: testorchestrator-linux-package
          path: candidate
      - name: install candidate through install.sh (no licence required)
        run: |
          set -e
          TB=$(find candidate -name "testorchestrator-*-linux-x86_64.tar.gz" | head -1)
          mkdir -p /tmp/cand-inst && tar -xzf "$TB" -C /tmp/cand-inst
          P=$(echo /tmp/cand-inst/testorchestrator-*-linux-x86_64)
          cd "$P"
          # The application licence is informational only — installation
          # must complete with NO licence code and no key substitution.
          bash install.sh \
            --payload /tmp/ci-payload --data /tmp/ci-data \
            --config /tmp/ci-config \
            --https-port 8443 --no-service-start --yes
      - name: installed payload carries portal-served worker assets
        run: |
          set -e
          # the bundled Buildbot worker installer + its matching
          # corresponding-source archive must land in the installed
          # payload — the portal serves them locally, never remotely.
          EXES=$(ls /tmp/ci-payload/packaging/windows/TestOrchestrator-Buildbot-Worker-Setup-*-UNSIGNED.exe 2>/dev/null | wc -l)
          test "$EXES" -eq 1 || {
            echo "expected exactly 1 bundled worker installer, found $EXES"; exit 1; }
          SRCS=$(ls /tmp/ci-payload/packaging/windows/TestOrchestrator-Buildbot-Sources-*.tar.gz 2>/dev/null | wc -l)
          test "$SRCS" -eq 1 || {
            echo "expected exactly 1 corresponding-source archive, found $SRCS"; exit 1; }
          LNX=$(ls /tmp/ci-payload/packaging/windows/TestOrchestrator-Buildbot-Worker-*-linux-x86_64.tar.gz 2>/dev/null | wc -l)
          test "$LNX" -eq 1 || {
            echo "expected exactly 1 linux worker bundle, found $LNX"; exit 1; }
          tar tzf /tmp/ci-payload/packaging/windows/TestOrchestrator-Buildbot-Worker-*-linux-x86_64.tar.gz \
            | grep -q "install_linux_worker.sh" || { echo "linux bundle lacks install script"; exit 1; }
          echo "PASS installed payload serves worker installer + linux bundle + sources"
      - name: installed payload includes + resolves reporting_labs
        run: |
          set -e
          test -f /tmp/ci-payload/3rdparty/reporting_labs/__init__.py
          test -f /tmp/ci-payload/3rdparty/reporting_labs/LICENSE
          cd /tmp/ci-payload
          ./venv/bin/python -c "import testorchestrator, reporting_labs; \
            assert '/3rdparty/' in reporting_labs.__file__, reporting_labs.__file__; \
            print('installed reporting_labs', reporting_labs.__version__, reporting_labs.__file__)"
      - name: report generation + serving from installed payload
        run: |
          set -e
          cd /tmp/ci-payload
          export TO_INSTANCE_DIR=/tmp/ci-data TO_SECURE_COOKIES=0
          ./venv/bin/python -m testorchestrator db-upgrade
          cp "$GITHUB_WORKSPACE/packaging/ci/report_serving_check.py" .
          ./venv/bin/python report_serving_check.py seed
          ./venv/bin/python report_serving_check.py check
          echo "PASS installer payload generates + serves reportingLabs reports"
      - name: single in-process frontend; install reruns cleanly
        run: |
          set -e
          cd $(echo /tmp/cand-inst/testorchestrator-*-linux-x86_64)
          bash install.sh \
            --payload /tmp/ci-payload-ch --data /tmp/ci-data-ch \
            --config /tmp/ci-config-ch \
            --https-port 8444 --no-service-start --yes
          # exactly one web unit — the in-process Cheroot tier; no
          # proxy unit files are staged anywhere
          test -f /tmp/ci-config-ch/testorchestrator-web.service
          ! compgen -G "/tmp/ci-config-ch/*caddy*" > /dev/null
          ! compgen -G "/tmp/ci-config-ch/*dagu*" > /dev/null
          grep -qi "cheroot" /tmp/ci-config-ch/testorchestrator-web.service
          # rerun is idempotent
          bash install.sh \
            --payload /tmp/ci-payload-ch --data /tmp/ci-data-ch \
            --config /tmp/ci-config-ch \
            --https-port 8444 --no-service-start --yes
          test -f /tmp/ci-config-ch/testorchestrator-web.service
          # the installed venv must carry the offline wheels
          /tmp/ci-payload-ch/venv/bin/python -c "import cheroot; print('cheroot', cheroot.__version__)"
          echo "PASS single-frontend install + idempotent rerun"
