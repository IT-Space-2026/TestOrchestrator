name: linux-package
on: {push: {branches: [main]}, pull_request: {}, workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: provision gitignored deps
        run: |
          set -e
          # dagu archives (checksum-verified against pinned digests)
          bash scripts/fetch_dagu.sh
          # vendored git rootfs for the packaged cli-backend fallback
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev ubuntu-keyring gpgv
          python3 scripts/acquire_git.py --suite resolute --arch amd64 \
            --acquire --verify-runtime
      - name: build dagu-worker Windows installer asset
        run: |
          set -e
          # The NSIS worker installer rides inside the linux package as
          # the intended downloadable worker asset — a clean checkout
          # has no staged exe, so it must be built here (makensis runs
          # on Linux; payload = checksum-verified pinned archive).
          sudo apt-get install -y --no-install-recommends nsis
          bash packaging/windows/build_worker_installer.sh
          ls -la packaging/windows/testorchestrator-dagu-worker-*-setup-UNSIGNED.exe
      - name: build bundle + self-extracting installer
        run: |
          set -e
          python3 scripts/build_bundle.py
          TB=$(ls dist/testorchestrator-*-linux-x86_64.tar.gz | head -1)
          python3 scripts/build_linux_installer.py "$TB" "${TB%.tar.gz}.run"
      - name: validate assembled package
        run: |
          set -e
          TB=$(ls dist/testorchestrator-*-linux-x86_64.tar.gz)
          mkdir -p /tmp/pkgx
          tar -xzf "$TB" -C /tmp/pkgx
          python3 scripts/validate_package.py /tmp/pkgx/testorchestrator-*/
      - name: checksums
        run: |
          cd dist
          sha256sum testorchestrator-*-linux-x86_64.tar.gz testorchestrator-*-linux-x86_64.run | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: testorchestrator-linux-package
          path: |
            dist/testorchestrator-*-linux-x86_64.tar.gz
            dist/testorchestrator-*-linux-x86_64.run
            dist/SHA256SUMS.txt
            dist/testorchestrator-*-linux-x86_64.manifest.json
          retention-days: 14

  installed-validate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: testorchestrator-linux-package
          path: candidate
      - name: fetch released v1.0.2 package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v1.0.2" \
            | python3 -c "import json,sys; print([a['id'] for a in json.load(sys.stdin)['assets'] if 'linux' in a['name'] and a['name'].endswith('.run')][0])")
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id" \
            -o v102.run
          ls -la v102.run
      - name: install released v1.0.2 payload + seed
        run: |
          set -e
          mkdir -p /tmp/v102
          LINE=$(grep -an -m1 "^__TO_ARCHIVE_BELOW__$" v102.run | cut -d: -f1)
          tail -n +$((LINE + 1)) v102.run | tar -xzf - -C /tmp/v102
          P=$(echo /tmp/v102/testorchestrator-*-linux-x86_64)
          cd "$P"
          export TO_INSTANCE_DIR=/tmp/to-inst TO_SECURE_COOKIES=0
          ./3rdparty/python-runtime/python/bin/python -m pip install \
            --no-index --find-links 3rdparty/python-wheels \
            -r requirements.txt -q
          ./3rdparty/python-runtime/python/bin/python \
            -m testorchestrator db-upgrade
          cp "$GITHUB_WORKSPACE/packaging/ci/report_serving_check.py" .
          ./3rdparty/python-runtime/python/bin/python \
            report_serving_check.py seed
      - name: candidate upgrade over retained instance + checks
        run: |
          set -e
          TB=$(ls candidate/testorchestrator-*-linux-x86_64.tar.gz)
          mkdir -p /tmp/cand && tar -xzf "$TB" -C /tmp/cand
          C=$(echo /tmp/cand/testorchestrator-*-linux-x86_64)
          cd "$C"
          export TO_INSTANCE_DIR=/tmp/to-inst TO_SECURE_COOKIES=0
          ./3rdparty/python-runtime/python/bin/python -m pip install \
            --no-index --find-links 3rdparty/python-wheels \
            -r requirements.txt -q
          # payload replaced; schema migrations run over retained data
          ./3rdparty/python-runtime/python/bin/python \
            -m testorchestrator db-upgrade
          cp "$GITHUB_WORKSPACE/packaging/ci/report_serving_check.py" .
          # reseed: the 1.x schema had no rl_* columns — the retained
          # execution gets the reporting-labs report wired up on the
          # post-migration schema (seed is idempotent)
          ./3rdparty/python-runtime/python/bin/python \
            report_serving_check.py seed
          ./3rdparty/python-runtime/python/bin/python \
            report_serving_check.py check
          echo "PASS retained reports/licence/access after v1.0.2->candidate upgrade"
