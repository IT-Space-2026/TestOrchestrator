name: linux-package
on: {push: {branches: [main]}, pull_request: {}, workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: provision gitignored deps
        run: |
          set -e
          # dagu archives (checksum-verified against pinned digests)
          bash scripts/fetch_dagu.sh
          # vendored git rootfs for the packaged cli-backend fallback
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev ubuntu-keyring gpgv
          python3 scripts/acquire_git.py --suite resolute --arch amd64 \
            --acquire --verify-runtime
          # bundled node runtime — verified against upstream SHASUMS256
          NODE_VER=26.13.1
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VER}/node-v${NODE_VER}-linux-x64.tar.xz"
          curl -fsSLO "https://nodejs.org/dist/v${NODE_VER}/SHASUMS256.txt"
          grep " node-v${NODE_VER}-linux-x64.tar.xz\$" SHASUMS256.txt | sha256sum -c -
          mkdir -p 3rdparty/nodejs
          tar -xJf "node-v${NODE_VER}-linux-x64.tar.xz" -C 3rdparty/nodejs/
          # bundled allure 3 generator + dependency tree
          cd 3rdparty/allure3 && npm ci --omit=dev
      - name: build bundle + self-extracting installer
        run: |
          set -e
          python3 scripts/build_bundle.py
          TB=$(ls dist/testorchestrator-*-linux-x86_64.tar.gz | head -1)
          python3 scripts/build_linux_installer.py "$TB" "${TB%.tar.gz}.run"
      - name: validate assembled package
        run: |
          set -e
          TB=$(ls dist/testorchestrator-*-linux-x86_64.tar.gz)
          mkdir -p /tmp/pkgx
          tar -xzf "$TB" -C /tmp/pkgx
          python3 scripts/validate_package.py /tmp/pkgx/testorchestrator-*/
      - name: checksums
        run: |
          cd dist
          sha256sum testorchestrator-*-linux-x86_64.tar.gz testorchestrator-*-linux-x86_64.run | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: testorchestrator-linux-package
          path: |
            dist/testorchestrator-*-linux-x86_64.tar.gz
            dist/testorchestrator-*-linux-x86_64.run
            dist/SHA256SUMS.txt
            dist/testorchestrator-*-linux-x86_64.manifest.json
          retention-days: 14
