name: rl-proto-package
# DISPOSABLE packaging measurement — workflow_dispatch only, never a
# release build. Stages the SAME Windows payload as app-installer.nsi
# minus 3rdparty Node/Allure3 plus reporting-labs==0.1.14, to measure
# real 2.0 candidate installer size/footprint. Produces a -PROTOTYPE
# exe; nothing here is published or distributed.
on:
  workflow_dispatch:
  push:
    branches: [feature/2.0-reporting-labs]

jobs:
  windows-proto:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: install nsis
        run: choco install nsis -y --no-progress

      - name: provision gitignored deps (dagu archives)
        shell: bash
        run: bash scripts/fetch_dagu.sh

      - name: stage payload via normal build script (2.0, no node or allure)
        shell: bash
        run: |
          set -e
          cd packaging/windows
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          bash build_app_installer.sh
          ls app-payload/site-packages | grep -qi "^reporting_labs" || {
            echo "MISSING reporting_labs"; exit 1; }
          echo "payload staged: $(du -sh app-payload | cut -f1)"

      - name: compile prototype installer (same NSIS settings)
        shell: bash
        run: |
          set -e
          cd packaging/windows
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          makensis -VERSION
          sed -e 's/!define VERSION "1.0.2"/!define VERSION "2.0.0-rlproto"/' \
              -e 's/testorchestrator-${VERSION}-windows-amd64-setup-UNSIGNED/testorchestrator-${VERSION}-windows-amd64-setup-PROTOTYPE/' \
              app-installer.nsi > proto-installer.nsi
          grep -n "VERSION\|OutFile" proto-installer.nsi | head -4
          makensis proto-installer.nsi
          ls -la *.exe
          sha256sum *.exe

      - name: record size + hash
        shell: bash
        run: |
          cd packaging/windows
          EXE=$(ls testorchestrator-*-PROTOTYPE.exe)
          echo "proto_installer=$EXE" >> "$GITHUB_OUTPUT" || true
          stat -c "%s %n" "$EXE"
          sha256sum "$EXE"
        id: size

      - name: smoke install (spaced path) + rl dependency check
        shell: pwsh
        run: |
          $exe = Get-Item ".\packaging\windows\testorchestrator-*-PROTOTYPE.exe" | Select-Object -First 1
          $inst = "C:\to proto install"
          $p = Start-Process $exe.FullName -ArgumentList "/S","/D=$inst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "proto install exited $($p.ExitCode)" }
          $size = (Get-ChildItem $inst -Recurse | Measure-Object Length -Sum).Sum
          Write-Host "installed footprint: $size bytes"
          if (Test-Path "$inst\nodejs") { throw "nodejs leaked into payload" }
          if (Test-Path "$inst\allure3") { throw "allure3 leaked into payload" }
          & "$inst\python\python.exe" -c "import reporting_labs, sys; print('reporting_labs OK', getattr(reporting_labs,'__version__','?'))"
          if ($LASTEXITCODE -ne 0) { throw "reporting_labs not importable in installed runtime" }
          Write-Host "PASS proto install + rl dependency available"

      - name: upload prototype (measurement artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: rl-proto-windows-setup
          path: packaging/windows/testorchestrator-*-PROTOTYPE.exe
          retention-days: 7
