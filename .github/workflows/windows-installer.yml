name: windows-installer
on: {push: {branches: [main]}, pull_request: {}, workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: provision gitignored deps
        shell: bash
        run: |
          bash scripts/fetch_dagu.sh
          if [ ! -d 3rdparty/allure3/node_modules ]; then
            cd 3rdparty/allure3 && npm ci --omit=dev 2>&1 | tail -3 || \
              npm install --omit=dev 2>&1 | tail -3; cd "$OLDPWD"
          fi
      - name: build payload + compile installer
        shell: bash
        run: |
          bash packaging/windows/build_app_installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: testorchestrator-windows-setup
          path: packaging/windows/testorchestrator-*-setup-UNSIGNED.exe
          retention-days: 14
