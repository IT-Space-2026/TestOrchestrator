name: windows-installer
on: {push: {branches: [main]}, pull_request: {}, workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: build payload + compile installer
        shell: bash
        run: |
          bash packaging/windows/build_app_installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: testorchestrator-windows-setup
          path: packaging/windows/testorchestrator-*-setup-UNSIGNED.exe
          retention-days: 14
