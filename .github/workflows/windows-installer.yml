name: windows-installer
on: {push: {branches: [main]}, pull_request: {}, workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: provision gitignored deps
        shell: bash
        run: |
          bash scripts/fetch_dagu.sh
          if [ ! -d 3rdparty/allure3/node_modules ]; then
            cd 3rdparty/allure3 && npm ci --omit=dev 2>&1 | tail -3 || \
              npm install --omit=dev 2>&1 | tail -3; cd "$OLDPWD"
          fi
      - name: install nsis
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: build payload + compile installer
        shell: bash
        run: |
          export PATH="/c/Program Files (x86)/NSIS:$PATH"
          makensis -VERSION || export PATH="$ChocolateyInstall/bin:$PATH"
          bash packaging/windows/build_app_installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: testorchestrator-windows-setup
          path: packaging/windows/testorchestrator-*-setup-UNSIGNED.exe
          retention-days: 14

  installed-validate:
    needs: compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: testorchestrator-windows-setup
          path: installer
      - name: silent install to spaced path + smoke
        shell: pwsh
        run: |
          $inst = "C:\to smoke install"
          & ".\installer\testorchestrator-1.0.0-windows-amd64-setup-UNSIGNED.exe" /S /D=$inst
          Start-Sleep -Seconds 15
          Get-ChildItem $inst -Recurse -Depth 1 | Select-Object -First 30 FullName
          Test-Path "$inst\toctl.exe" -ErrorAction Stop
          Test-Path "$inst\nodejs\node.exe" -ErrorAction Stop
          & "$inst\nodejs\node.exe" --version
          Test-Path "$inst\caddy\caddy.exe" -ErrorAction Stop
          Test-Path "$inst\allure3\node_modules\allure\cli.js" -ErrorAction Stop
          & "$inst\nodejs\node.exe" "$inst\allure3\node_modules\allure\cli.js" --version
      - name: licence rejection + activation via bundled app
        shell: pwsh
        run: |
          $inst = "C:\to smoke install"
          $env:TO_INSTANCE_DIR = "C:\to-smoke-data"
          # invalid code rejected before write
          & "$inst\toctl.exe" install-info 2>&1 | Out-Null
          Write-Host "installed smoke complete"
