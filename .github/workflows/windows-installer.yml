name: windows-installer
on: {push: {branches: [main, "feature/2.0.1", "feature/2.0.2"]}, pull_request: {}, workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: report-serving tests on Windows
        shell: bash
        # safe_under + generation-scoped serving: Windows-specific
        # path checks run on the target OS.
        run: |
          pip install -r requirements-dev.txt -q
          python -m pytest tests/test_safe_under.py tests/test_reporting_labs_poc.py -x -q
      - name: nsis (system prerequisite)
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: one-command release build
        run: python build-scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: testorchestrator-windows-setup
          path: |
            dist/release/windows/*windows-amd64-setup-UNSIGNED.exe
            dist/release/windows/SHA256SUMS.txt
            dist/release/windows/build-manifest.json
          retention-days: 14

  installed-validate:
    needs: compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: testorchestrator-windows-setup
          path: installer
      - name: silent install to spaced path + payload assertions
        shell: pwsh
        run: |
          $inst = "C:\to smoke install"
          $p = Start-Process (Get-ChildItem -Recurse ".\installer" -Filter "*windows-amd64-setup-UNSIGNED.exe" | Select-Object -First 1).FullName -ArgumentList "/S","/D=$inst" -Wait -PassThru
          Write-Host "installer exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "installer exited $($p.ExitCode)" }
          foreach ($f in @("$inst\python\python.exe","$inst\caddy\caddy.exe","$inst\dagu\dagu.exe","$inst\wsgi.py","$inst\testorchestrator\__main__.py","$inst\release\licence_pubkey.pem","$inst\run_worker.py","$inst\3rdparty\reporting_labs\__init__.py","$inst\3rdparty\reporting_labs\LICENSE")) {
            if (!(Test-Path $f)) { throw "MISSING: $f" }
            Write-Host "present: $f"
          }
          # worker-download assets the installed portal must serve —
          # both pinned dagu archives and the bundled NSIS worker
          # installer; never fetched remotely at runtime.
          foreach ($g in @("$inst\3rdparty\dagu\dagu.sha256",
                           "$inst\3rdparty\dagu\dagu_*_linux_amd64.tar.gz",
                           "$inst\3rdparty\dagu\dagu_*_windows_amd64.tar.gz",
                           "$inst\packaging\windows\testorchestrator-dagu-worker-*-setup-UNSIGNED.exe")) {
            if (!(Get-ChildItem $g -ErrorAction SilentlyContinue)) { throw "MISSING worker asset: $g" }
            Write-Host "present: $g"
          }
      - name: scheduled-task service registration
        shell: pwsh
        run: |
          foreach ($t in @("TestOrchestratorWeb","TestOrchestratorWorker","TestOrchestratorDagu","TestOrchestratorCaddy")) {
            schtasks /Query /TN $t 2>$null | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "task NOT registered: $t" }
            Write-Host "task registered: $t"; schtasks /Query /TN $t /V /FO LIST | Select-String "Task To Run|Status|Last Result"
          }
          # installer must have started the tasks (no reboot required)
          $status = schtasks /Query /TN "TestOrchestratorWeb" /FO LIST | Select-String "Status:"
          Write-Host "Web task status post-install: $status"
          Test-Path "C:\ProgramData\TestOrchestrator\Caddyfile" -ErrorAction Stop
          Test-Path "C:\ProgramData\TestOrchestrator\run_dagu.cmd" -ErrorAction Stop
      - name: env-file config loaded (TO_INSTANCE_DIR via %ProgramData%)
        shell: pwsh
        run: |
          $inst = "C:\to smoke install"
          # installed env file must be picked up by config.py (no manual env);
          # run from $inst so the payload root is on sys.path
          Remove-Item Env:TO_INSTANCE_DIR,Env:TO_DATABASE_URI -ErrorAction SilentlyContinue
          Push-Location $inst
          & "$inst\python\python.exe" -c "from testorchestrator.config import INSTANCE_DIR; print('INSTANCE_DIR =', INSTANCE_DIR)" 2>&1
          Pop-Location
      - name: task-run readiness via schtasks
        shell: pwsh
        run: |
          # installer already started the tasks — first confirm health, then
          # bounce Web via Task Scheduler to prove the real delivery mechanism
          $ok = $false
          for ($i=0; $i -lt 60; $i++) { try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:18080/healthz" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop; if ($r.StatusCode -eq 200) { $ok=$true; break } } catch {}; Start-Sleep 1 }
          if (!$ok) {
            Write-Host "=== diagnostics: task-started web not ready ==="
            Get-Process python,dagu,caddy -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,StartTime | Format-Table
            Get-NetTCPConnection -LocalPort 18080,29877,443 -State Listen -ErrorAction SilentlyContinue | Select-Object LocalPort,OwningProcess
            schtasks /Query /TN "TestOrchestratorWeb" /V /FO LIST | Select-String "Status|Last Result"
            Get-Content "C:\ProgramData\TestOrchestrator\logs\web.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
            Write-Host "=== manual run of same .cmd (isolates Session-0/SYSTEM) ==="
            schtasks /End /TN "TestOrchestratorWeb" 2>$null | Out-Null; Start-Sleep 2
            $cx = Get-NetTCPConnection -LocalPort 18080 -State Listen -ErrorAction SilentlyContinue
            if ($cx) { Stop-Process -Id $cx[0].OwningProcess -Force -ErrorAction SilentlyContinue }
            $m = Start-Process "cmd.exe" -ArgumentList "/c","C:\ProgramData\TestOrchestrator\run_web.cmd" -PassThru
            $mok = $false
            for ($i=0; $i -lt 30; $i++) { try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:18080/healthz" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop; if ($r.StatusCode -eq 200) { $mok=$true; break } } catch {}; Start-Sleep 1 }
            Write-Host "manual .cmd run healthy: $mok"
            Get-Content "C:\ProgramData\TestOrchestrator\logs\web.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
            Write-Host "=== isolate: stop Worker task, retry web (sqlite lock contention?) ==="
            schtasks /End /TN "TestOrchestratorWorker" 2>$null | Out-Null; Start-Sleep 2
            $c2 = $false
            for ($i=0; $i -lt 20; $i++) { try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:18080/healthz" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop; if ($r.StatusCode -eq 200) { $c2=$true; break } } catch {}; Start-Sleep 1 }
            Write-Host "web healthy with Worker stopped: $c2"
            throw "installer-started web task never became HTTP-ready"
          }
          Write-Host "PASS Web task serves :18080 (started by installer, no reboot)"
          # supported stop path: the product's own stop_to.cmd ends tasks
          # AND reaps orphaned children (no harness-side reaping)
          & "C:\ProgramData\TestOrchestrator\stop_to.cmd" 2>&1 | Out-Null; Start-Sleep 3
          $still = Get-NetTCPConnection -LocalPort 18080 -State Listen -ErrorAction SilentlyContinue
          if ($still) { throw "port 18080 still bound after product stop_to.cmd — orphaned child survived" }
          Write-Host "PASS product stop_to.cmd reaps orphaned children"
          # stop_to ends all four tasks — restart the full set for the
          # remaining readiness checks
          schtasks /Run /TN "TestOrchestratorWeb" | Out-Null
          schtasks /Run /TN "TestOrchestratorWorker" | Out-Null
          schtasks /Run /TN "TestOrchestratorDagu" | Out-Null
          schtasks /Run /TN "TestOrchestratorCaddy" | Out-Null
          $ok = $false
          for ($i=0; $i -lt 60; $i++) { try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:18080/healthz" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop; if ($r.StatusCode -eq 200) { $ok=$true; break } } catch {}; Start-Sleep 1 }
          if (!$ok) { Get-Content "C:\ProgramData\TestOrchestrator\logs\web.log" -ErrorAction SilentlyContinue | Select-Object -Last 25; throw "web task did not recover after stop_to.cmd + /Run" }
          Write-Host "PASS Web restart via supported stop_to.cmd + schtasks /Run"
          # Dagu coordinator health on provisioned port 29877
          $dok = $false
          for ($i=0; $i -lt 20; $i++) { try { $r = Invoke-WebRequest -Uri "http://127.0.0.1:29877/api/v1/dags" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop; $dok=$true; break } catch {}; Start-Sleep 1 }
          if (!$dok) { Write-Host "dagu health endpoint not yet reachable (auth may reject anonymous probe — checking port)"; $l = Get-NetTCPConnection -LocalPort 29877 -State Listen -ErrorAction SilentlyContinue; if (!$l) { throw "dagu task not listening on 29877" }; Write-Host "dagu listening on 29877 (auth-gated probe)" } else { Write-Host "PASS dagu API reachable on 29877" }
          # Installer must have trusted the per-installation Caddy root CA
          # in LocalMachine\Root — verify it landed, then validate HTTPS
          # with REAL certificate trust (no -SkipCertificateCheck).
          $ca = Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -like "*Caddy Local Authority*" }
          if (!$ca) { throw "Caddy root CA not in LocalMachine\Root — installer trust step failed" }
          Write-Host "PASS installer trusted per-installation Caddy CA: $($ca.Subject) [$($ca.Thumbprint)]"
          $cok = $false
          for ($i=0; $i -lt 20; $i++) { try { $r = Invoke-WebRequest -Uri "https://localhost/healthz" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop; if ($r.StatusCode -eq 200) { $cok=$true; break } } catch {}; Start-Sleep 1 }
          if (!$cok) { throw "caddy HTTPS on :443 did not pass REAL certificate validation" }
          Write-Host "PASS caddy HTTPS :443 -> waitress, certificate-validated (https://localhost/)"
          $resp = try { Invoke-WebRequest -Uri "https://localhost/licence" -UseBasicParsing -MaximumRedirection 0 -ErrorAction Stop } catch { $_.Exception.Response }
          Write-Host "unauth /licence via caddy (cert-validated) -> $([int]$resp.StatusCode)"
      - name: licence negative + ephemeral-positive + persistence
        shell: pwsh
        run: |
          $inst = "C:\to smoke install"
          $env:TO_INSTANCE_DIR = "C:\to-smoke-lic\instance"
          $env:TO_DATABASE_URI = "sqlite:///C:/to-smoke-lic/instance/to.db"
          New-Item -ItemType Directory -Force "C:\to-smoke-lic\instance" | Out-Null
          Copy-Item ".\packaging\windows\ci\licence_activate.py",".\packaging\windows\ci\licence_restart.py" "$inst\"
          & "$inst\python\python.exe" "$inst\licence_activate.py" 2>&1
          if ($LASTEXITCODE -ne 0) { throw "licence activation checks failed" }
          & "$inst\python\python.exe" "$inst\licence_restart.py" 2>&1
          if ($LASTEXITCODE -ne 0) { throw "licence restart/persistence failed" }
          Remove-Item "$inst\licence_activate.py","$inst\licence_restart.py" -Force
          Remove-Item -Recurse -Force "C:\to-smoke-lic" -ErrorAction SilentlyContinue
      - name: authenticated report serving on installed package
        shell: pwsh
        run: |
          # in-process check via the INSTALLED payload's own python —
          # same technique as the licence CI scripts: real shipped route
          # code + real ProgramData instance DB, seeded sanitised data.
          $inst = "C:\to smoke install"
          Copy-Item ".\packaging\ci\report_serving_check.py" "$inst\"
          Push-Location $inst
          & "$inst\python\python.exe" "$inst\report_serving_check.py" 2>&1
          $rc = $LASTEXITCODE
          Pop-Location
          Remove-Item "$inst\report_serving_check.py" -Force
          if ($rc -ne 0) { throw "authenticated report-serving check failed" }
      - name: private-data ACLs + Edge headless cert-validated browser render
        shell: pwsh
        run: |
          $data = "C:\ProgramData\TestOrchestrator"
          foreach ($d in @("$data\caddy-home","$data\instance","$data\dagu-cfg")) {
            $bad = (Get-Acl $d).Access | Where-Object { $_.IdentityReference -match 'Users|Everyone' -and $_.AccessControlType -eq 'Allow' }
            if ($bad) { throw "world-readable private dir: $d ($($bad.IdentityReference -join ','))" }
          }
          Write-Host "PASS caddy-home/instance/dagu-cfg ACLs exclude Users/Everyone"
          if (Test-Path "$data\CERT-TRUST-NOT-INSTALLED.txt") { throw "cert-trust failure marker present — trust step failed silently" }
          $edge = "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          if (!(Test-Path $edge)) { $edge = "C:\Program Files\Microsoft\Edge\Application\msedge.exe" }
          if (!(Test-Path $edge)) { Write-Host "SKIP: no Edge on runner — real-browser check deferred" } else {
            $dom = (& $edge --headless=new --disable-gpu --dump-dom "https://localhost/licence" 2>$null | Out-String)
            if ($dom -notmatch "licen") { throw "Edge headless did not render /licence (real-browser cert validation failed)" }
            & $edge --headless=new --disable-gpu --window-size=1366,900 "--screenshot=$PWD\licence-page.png" "https://localhost/licence" 2>$null | Out-Null
            if (!(Test-Path "licence-page.png") -and (Test-Path "screenshot.png")) { Move-Item "screenshot.png" "licence-page.png" -Force }
            if (!(Test-Path "licence-page.png")) { throw "licence screenshot not produced" }
            Write-Host "PASS Edge headless rendered https://localhost/licence with real cert validation"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screenshots
          path: licence-page.png
          if-no-files-found: ignore
      - name: upgrade + uninstall/reinstall lifecycle matrix
        shell: pwsh
        run: |
          $inst = "C:\to smoke install"
          $data = "C:\ProgramData\TestOrchestrator"
          $setup = (Get-ChildItem -Recurse ".\installer" -Filter "*windows-amd64-setup-UNSIGNED.exe" | Select-Object -First 1).FullName
          # registered uninstall entry points must exist and point at supported flows
          $arp = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\TestOrchestrator' -ErrorAction Stop
          if ($arp.UninstallString -ne "`"$inst\uninstall.exe`"") { throw "UninstallString wrong: $($arp.UninstallString)" }
          if ($arp.QuietUninstallString -notlike "*uninstall_to.cmd*") { throw "QuietUninstallString wrong/missing: $($arp.QuietUninstallString)" }
          Write-Host "PASS ARP registration: UninstallString=$($arp.UninstallString) Quiet=$($arp.QuietUninstallString)"
          # foreign CA + stray python must survive OUR lifecycle operations
          # self-signed certs generate in My (a key store); the public
          # cert is then imported into Root as a foreign trusted CA
          $f0 = New-SelfSignedCertificate -Subject "CN=Caddy Local Authority - foreign-test" -CertStoreLocation Cert:\LocalMachine\My -KeyExportPolicy NonExportable
          Export-Certificate -Cert $f0 -FilePath .\foreign-ca.cer | Out-Null
          Import-Certificate -FilePath .\foreign-ca.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $foreign = Get-Item Cert:\LocalMachine\Root\$($f0.Thumbprint)
          $stray = Start-Process python -ArgumentList '-c "import time;time.sleep(600)"' -PassThru -ErrorAction Stop
          $thumb1 = (Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -like "*Caddy Local Authority*" -and $_.Thumbprint -ne $foreign.Thumbprint }).Thumbprint
          if (!$thumb1) { throw "our CA thumbprint not found pre-upgrade" }
          # UPGRADE: same installer over existing install, data retained
          $p = Start-Process $setup -ArgumentList "/S","/D=$inst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "upgrade install exited $($p.ExitCode)" }
          $thumb2 = (Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -like "*Caddy Local Authority*" -and $_.Thumbprint -ne $foreign.Thumbprint }).Thumbprint
          if ($thumb2 -ne $thumb1) { throw "upgrade replaced the trusted CA (was $thumb1 now $thumb2) — caddy-home not retained" }
          Write-Host "PASS upgrade: CA thumbprint retained ($thumb1)"
          $ok = $false
          for ($i=0; $i -lt 60; $i++) { try { $r = Invoke-WebRequest -Uri "https://localhost/healthz" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop; if ($r.StatusCode -eq 200) { $ok=$true; break } } catch {}; Start-Sleep 1 }
          if (!$ok) { throw "app not healthy after upgrade" }
          Write-Host "PASS app healthy after upgrade (cert-validated)"
          # UNINSTALL with data retained (silent → default keeps data)
          # probe: each generated helper must terminate (stall isolation)
          foreach ($h in @("$data\untrust_caddy.cmd","$data\stop_to.cmd")) {
            $j = Start-Job { param($p) & $p *> $null } -ArgumentList $h
            if (!(Wait-Job $j -Timeout 60)) { Write-Host "HANG: $h"; Get-Content $h; Stop-Job $j; Remove-Job $j -Force } else { Remove-Job $j -Force; Write-Host "helper ok: $h" }
          }
          # silent uninstall via the REGISTERED QuietUninstallString — the
          # actual customer-facing entry point, not a dev-side shortcut
          $q = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\TestOrchestrator').QuietUninstallString
          cmd /c "$q" | Out-Null
          for ($i=0; $i -lt 120 -and (Test-Path "$inst"); $i++) { Start-Sleep 1 }
          if (Test-Path "$inst") { Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'uninstall|Un_|_\?=' } | Select-Object ProcessId,Name,CommandLine | Format-Table -AutoSize | Out-String | Write-Host; schtasks /Query /TN "TestOrchestratorWeb" 2>&1 | Select-Object -Last 2; throw "uninstall did not remove payload dir within 480s — product defect, not masked" }
          Write-Host "PASS payload dir removed by uninstaller"
          if (!(Test-Path "$data\instance")) { throw "uninstall deleted retained data dir" }
          $remain = Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Thumbprint -eq $thumb1 }
          if ($remain) { throw "uninstall left our CA trusted" }
          if (!(Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Thumbprint -eq $foreign.Thumbprint })) { throw "uninstall removed UNRELATED Caddy CA" }
          if (!(Get-Process -Id $stray.Id -ErrorAction SilentlyContinue)) { throw "stop_to.cmd killed unrelated python process" } else { Stop-Process -Id $stray.Id -Force }
          if (Get-NetTCPConnection -LocalPort 18080 -State Listen -ErrorAction SilentlyContinue) { throw "port 18080 still bound after uninstall" }
          if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\TestOrchestrator') { throw "uninstall left stale ARP registry entry" }
          Write-Host "PASS uninstall(retain): data kept, our CA untrusted, foreign CA + stray python survived, ARP cleaned"
          # REINSTALL
          $p = Start-Process $setup -ArgumentList "/S","/D=$inst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "reinstall exited $($p.ExitCode)" }
          $thumb3 = (Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -like "*Caddy Local Authority*" -and $_.Thumbprint -ne $foreign.Thumbprint }).Thumbprint
          if ($thumb3 -ne $thumb1) { throw "reinstall after retained-data uninstall lost the CA (was $thumb1 now $thumb3)" }
          $ok = $false
          for ($i=0; $i -lt 60; $i++) { try { $r = Invoke-WebRequest -Uri "https://localhost/healthz" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop; if ($r.StatusCode -eq 200) { $ok=$true; break } } catch {}; Start-Sleep 1 }
          if (!$ok) { throw "app not healthy after reinstall" }
          Write-Host "PASS reinstall over retained data: same CA trusted, app healthy"
          # UNINSTALL with data removed
          & "$data\uninstall_to.cmd" "/PURGE" | Out-Null
          for ($i=0; $i -lt 120 -and (Test-Path "$inst"); $i++) { Start-Sleep 1 }
          if (Test-Path "$inst") { throw "purge uninstall left payload dir after 120s" }
          for ($i=0; $i -lt 60 -and (Test-Path $data); $i++) { Start-Sleep 1 }
          if (Test-Path $data) {
            Write-Host "data dir contents after purge:"
            cmd /c "dir /b /s `"$data`""
            Write-Host "temp-copy present: $(Test-Path "$env:TEMP\to-uninstall.cmd")"
            Write-Host "processes under data dir:"
            Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path.StartsWith($data) } | Format-Table Name,Id,Path | Out-Host
            cmd /c "rmdir /s /q `"$data`""
            cmd /c "dir /b /s `"$data`""
            throw "/PURGE left data dir behind"
          }
          Write-Host "PASS uninstall(purge): data dir removed"
          Remove-Item "HKLM:\SOFTWARE\Microsoft\SystemCertificates\Root\Certificates\$($foreign.Thumbprint)" -Recurse -Force -ErrorAction Ignore

  upgrade-from-v102:
    needs: compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: testorchestrator-windows-setup
          path: candidate
      - name: fetch released v1.0.2 installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v1.0.2" \
            | python -c "import json,sys; print([a['id'] for a in json.load(sys.stdin)['assets'] if 'windows' in a['name'] and a['name'].endswith('.exe')][0])")
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id" \
            -o v102-setup.exe
          ls -la v102-setup.exe
      - name: install released v1.0.2 + seed sanitised report
        shell: pwsh
        run: |
          $inst = "C:\to upgrade install"
          $p = Start-Process ".\v102-setup.exe" -ArgumentList "/S","/D=$inst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "v1.0.2 install exited $($p.ExitCode)" }
          $thumb1 = (Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -like "*Caddy Local Authority*" }).Thumbprint
          Write-Host "v1.0.2 installed; CA thumbprint: $thumb1"
          Set-Content "$env:TEMP\thumb1.txt" $thumb1
          Copy-Item ".\packaging\ci\report_serving_check.py" "$inst\"
          Push-Location $inst
          & "$inst\python\python.exe" "$inst\report_serving_check.py" seed 2>&1
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "seed on v1.0.2 failed" }
          & "$inst\python\python.exe" "$inst\report_serving_check.py" check 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "NOTE: serving check PASSED on v1.0.2"
          } else {
            Write-Host "NOTE: report serving check failed on released v1.0.2"
          }
          Pop-Location
          exit 0   # informational check above may leave LASTEXITCODE=1
      - name: upgrade to maintenance candidate + verify retained data
        shell: pwsh
        run: |
          $inst = "C:\to upgrade install"
          $thumb1 = Get-Content "$env:TEMP\thumb1.txt"
          $setup = Get-ChildItem -Recurse ".\candidate" -Filter "*windows-amd64-setup-UNSIGNED.exe" | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/S","/D=$inst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "upgrade install exited $($p.ExitCode)" }
          $thumb2 = (Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -like "*Caddy Local Authority*" }).Thumbprint
          if ($thumb2 -ne $thumb1) { throw "upgrade replaced trusted CA ($thumb1 -> $thumb2)" }
          Write-Host "PASS upgrade: CA thumbprint retained ($thumb1)"
          $ok = $false
          for ($i=0; $i -lt 60; $i++) { try { $r = Invoke-WebRequest -Uri "https://localhost/healthz" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop; if ($r.StatusCode -eq 200) { $ok=$true; break } } catch {}; Start-Sleep 1 }
          if (!$ok) { throw "app not healthy after v1.0.2->candidate upgrade" }
          Write-Host "PASS app healthy after upgrade (cert-validated)"
          Push-Location $inst
          # reseed: 1.x schema had no rl_* columns — wire the rlabs
          # report onto the retained execution post-migration
          & "$inst\python\python.exe" "$inst\report_serving_check.py" seed 2>&1
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "post-upgrade reseed failed" }
          & "$inst\python\python.exe" "$inst\report_serving_check.py" check 2>&1
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "post-upgrade report-serving check failed" }
          Write-Host "PASS retained reports/licence/verified access after v1.0.2->candidate upgrade"

  upgrade-from-v202:
    needs: compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: testorchestrator-windows-setup
          path: candidate
      - name: fetch released v2.0.2 installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/v2.0.2" \
            | python -c "import json,sys; print([a['id'] for a in json.load(sys.stdin)['assets'] if 'windows' in a['name'] and a['name'].endswith('.exe') and 'dagu' not in a['name']][0])")
          curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id" \
            -o v202-setup.exe
          ls -la v202-setup.exe
      - name: install released v2.0.2 + seed sanitised report
        shell: pwsh
        run: |
          $inst = "C:\to upgrade install v202"
          $p = Start-Process ".\v202-setup.exe" -ArgumentList "/S","/D=$inst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "v2.0.2 install exited $($p.ExitCode)" }
          $thumb1 = (Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -like "*Caddy Local Authority*" }).Thumbprint
          Set-Content "$env:TEMP\thumb1v202.txt" $thumb1
          Copy-Item ".\packaging\ci\report_serving_check.py" "$inst\"
          Push-Location $inst
          & "$inst\python\python.exe" "$inst\report_serving_check.py" seed 2>&1
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "seed on v2.0.2 failed" }
          & "$inst\python\python.exe" "$inst\report_serving_check.py" check 2>&1
          if ($LASTEXITCODE -ne 0) { Pop-Location; throw "serving check failed on released v2.0.2" }
          Pop-Location
      - name: upgrade to candidate + verify retained data
        shell: pwsh
        run: |
          $inst = "C:\to upgrade install v202"
          $thumb1 = Get-Content "$env:TEMP\thumb1v202.txt"
          $setup = Get-ChildItem -Recurse ".\candidate" -Filter "*windows-amd64-setup-UNSIGNED.exe" | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList "/S","/D=$inst" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "upgrade install exited $($p.ExitCode)" }
          $thumb2 = (Get-ChildItem Cert:\LocalMachine\Root | Where-Object { $_.Subject -like "*Caddy Local Authority*" }).Thumbprint
          if ($thumb2 -ne $thumb1) { throw "upgrade replaced trusted CA ($thumb1 -> $thumb2)" }
          Write-Host "PASS upgrade: CA thumbprint retained ($thumb1)"
          $ok = $false
          for ($i=0; $i -lt 60; $i++) { try { $r = Invoke-WebRequest -Uri "https://localhost/healthz" -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop; if ($r.StatusCode -eq 200) { $ok=$true; break } } catch {}; Start-Sleep 1 }
          if (!$ok) { throw "app not healthy after v2.0.2->candidate upgrade" }
          Write-Host "PASS app healthy after upgrade (cert-validated)"
          Push-Location $inst
          & "$inst\python\python.exe" "$inst\report_serving_check.py" check 2>&1
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) { throw "post-upgrade report-serving check failed" }
          Write-Host "PASS retained reports/licence/verified access after v2.0.2->candidate upgrade"
