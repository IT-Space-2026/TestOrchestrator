# TestOrchestrator Buildbot master configuration.
#
# Generated once by scripts/provision_buildbot.py. This file is NOT
# edited per-target: it reads ``targets.json`` (builders/routing,
# portal-written on every Admin-UI change) and ``secrets.json`` (0600,
# API + worker credentials) at every `buildbot reconfig`. Saved portal
# settings take effect with no manual controller commands.
#
# Topology (docs/orchestration-replacement.md):
#   - one builder per execution target: to-target-<id> on its worker
#   - one builder per SSH target:     to-ssh-<id> on to-ssh-dispatcher
#   - source arrives as a portal-staged tar via FileDownload; results
#     return via DirectoryUpload — no git needed on any remote host.

import json
import os

from buildbot.plugins import (schedulers, steps, util, worker as
                              worker_plugin)

# realpath: master.cfg may be symlinked INTO the master basedir while
# the JSON files live one level up in the buildbot home.
BB_DIR = os.path.dirname(os.path.realpath(__file__))


def _load(name, default):
    try:
        with open(os.path.join(BB_DIR, name)) as fh:
            return json.load(fh)
    except (OSError, ValueError):
        return default


targets = _load("targets.json", {"workers": [], "targets": []})
secrets = _load("secrets.json", {})
worker_passwords = secrets.get("worker_passwords", {})
api_user = secrets.get("api_user", "to-api")
api_password = secrets.get("api_password", "")

c = BuildmasterConfig = {}

# Product requirement: never phone home.
c["buildbotNetUsageData"] = None

# ---------------------------------------------------------------- workers

c["workers"] = [
    worker_plugin.Worker(
        w["name"], worker_passwords.get(w["name"], ""),
        max_builds=w.get("max_builds"))
    for w in targets.get("workers", [])
]

# PB is the only protocol remote workers need — they dial out to it.
c["protocols"] = {"pb": {"port": targets.get(
    "pb_port", "tcp:9989:interface=0.0.0.0")}}

c["change_source"] = []
c["services"] = []

# ------------------------------------------------- per-run renderables

STAGING = targets.get("staging_dir", os.path.join(BB_DIR, "staging"))
ARTIFACTS = targets.get("artifacts_dir",
                        os.path.join(BB_DIR, "artifacts"))


@util.renderer
def _source_tar(props):
    """Portal-staged source archive for this execution (per-run path —
    the portal writes it before submitting the buildrequest)."""
    return os.path.join(STAGING, props.getProperty("to_execution_id")
                        + ".tar")


@util.renderer
def _exec_argv(props):
    """Validated runner spec -> argv list, rendered master-side so the
    worker receives a command list — never a shell string. The spec
    carries executable/args/optional credential-file wrapper paths;
    secrets are never present in properties."""
    spec = json.loads(props.getProperty("exec_spec", "{}"))
    if spec.get("credential_wrapper") and spec.get("credential_file"):
        return [spec["credential_wrapper"], spec["credential_file"],
                spec["executable"], *spec.get("args", [])]
    return [spec["executable"], *spec.get("args", [])]


@util.renderer
def _exec_workdir(props):
    spec = json.loads(props.getProperty("exec_spec", "{}"))
    return spec.get("exec_workdir") or "build"


@util.renderer
def _exec_env(props):
    """Optional extra environment for the exec step (e.g.
    PLAYWRIGHT_JUNIT_OUTPUT_FILE for the JUnit reporter path)."""
    spec = json.loads(props.getProperty("exec_spec", "{}"))
    return spec.get("env") or {}


@util.renderer
def _report_src(props):
    spec = json.loads(props.getProperty("exec_spec", "{}"))
    return spec.get("report_src") or "Reports"


@util.renderer
def _artifact_dest(props):
    return os.path.join(ARTIFACTS, props.getProperty("to_execution_id"))


@util.renderer
def _exec_timeout(props):
    try:
        return int(props.getProperty("exec_timeout") or 7200)
    except (TypeError, ValueError):
        return 7200


@util.renderer
def _ssh_argv(props):
    """Agentless SSH targets: the dispatcher script does connect/exec/
    collect; the spec file path (portal-written, holds no secrets) is
    the single argument."""
    spec = json.loads(props.getProperty("exec_spec", "{}"))
    return [spec["python"], spec["dispatcher_script"],
            spec["spec_file"]]


def _kre_factory():
    """Local + remote worker targets: staged source in, validated argv
    run, reports out, workspace cleaned. No git on the worker."""
    f = util.BuildFactory()
    f.addStep(steps.FileDownload(
        mastersrc=_source_tar, workerdest="source.tar",
        name="fetch-source"))
    f.addStep(steps.ShellCommand(
        command=["tar", "-xf", "source.tar", "-C", "."],
        workdir="build", name="unpack-source"))
    f.addStep(steps.ShellCommand(
        command=_exec_argv, workdir=_exec_workdir,
        name="run", timeout=_exec_timeout, logEnviron=False,
        env=_exec_env))
    f.addStep(steps.DirectoryUpload(
        workersrc=_report_src, masterdest=_artifact_dest,
        name="upload-reports", alwaysRun=True))
    f.addStep(steps.ShellCommand(
        command=["rm", "-rf", "source.tar", "src", "Reports",
                 "logs", "work"],
        workdir="build", name="cleanup", alwaysRun=True))
    return f


def _ssh_factory():
    f = util.BuildFactory()
    f.addStep(steps.ShellCommand(command=_ssh_argv, name="ssh-run"))
    f.addStep(steps.DirectoryUpload(
        workersrc="remote-artifacts", masterdest=_artifact_dest,
        name="upload-artifacts", alwaysRun=True))
    f.addStep(steps.ShellCommand(
        command=["rm", "-rf", "remote-artifacts"], workdir="build",
        name="cleanup", alwaysRun=True))
    return f


# ---------------------------------------------------------------- builds

builder_names = []
builder_cfgs = []
for t in targets.get("targets", []):
    if not t.get("enabled", True):
        continue
    name = t["builder"]
    builder_names.append(name)
    builder_cfgs.append(util.BuilderConfig(
        name=name,
        workernames=[t["worker"]],
        factory=_ssh_factory() if t.get("kind") == "ssh"
        else _kre_factory(),
        properties={"to_target_id": t["id"]}))

# A freshly provisioned master has no targets yet (they appear once an
# admin registers execution targets and the portal syncs targets.json).
# Keep a placeholder builder so the config validates and the master
# boots — it's force-scheduled but never forced from the portal.
if not builder_cfgs:
    builder_names.append("to-noop")
    builder_cfgs.append(util.BuilderConfig(
        name="to-noop",
        workernames=["to-local"],
        factory=_kre_factory()))

c["builders"] = builder_cfgs

# ---------------------------------------------------------------- sched

c["schedulers"] = [schedulers.ForceScheduler(
    name="to-force",
    builderNames=builder_names,
    properties=[
        util.StringParameter(name="to_execution_id", size=40),
        util.StringParameter(name="exec_spec", size=20000),
        util.StringParameter(name="exec_timeout", default="7200",
                             size=10),
    ])]

# -------------------------------------------------------------- www/api
# REST API bound to localhost only — the portal's BuildbotAdapter is its
# sole client; the bundled web UI is not a product surface and is never
# proxied by the frontend.

from buildbot.www.auth import UserPasswordAuth  # noqa: E402
from buildbot.www.authz.authz import Authz  # noqa: E402
from buildbot.www.authz.endpointmatchers import (  # noqa: E402
    AnyControlEndpointMatcher, AnyEndpointMatcher)
from buildbot.www.authz.roles import RolesFromUsername  # noqa: E402

c["www"] = dict(
    port=targets.get("www_port",
                     "tcp:8010:interface=127.0.0.1"),
    auth=UserPasswordAuth({api_user: api_password}),
    authz=Authz(
        allowRules=[AnyControlEndpointMatcher(role="api"),
                    AnyEndpointMatcher(role="api", defaultDeny=False)],
        roleMatchers=[RolesFromUsername(usernames=[api_user],
                                        roles=["api"])]))

c["title"] = "TestOrchestrator build master"
c["titleURL"] = targets.get("portal_url", "http://localhost")
c["buildbotURL"] = targets.get("buildbot_url", "http://localhost:8010/")
c["db"] = {"db_url": "sqlite:///state.sqlite"}
