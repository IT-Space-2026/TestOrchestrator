# TestOrchestrator Buildbot master configuration.
#
# Generated once by scripts/provision_buildbot.py. This file is NOT
# edited per-target: it reads ``targets.json`` (builders/routing,
# portal-written on every Admin-UI change) and ``secrets.json`` (0600,
# API + worker credentials) at every `buildbot reconfig`. Saved portal
# settings take effect with no manual controller commands.
#
# Topology (docs/orchestration-replacement.md):
#   - one builder per execution target: to-target-<id> on its worker
#   - one builder per SSH target:     to-ssh-<id> on to-ssh-dispatcher
#   - source arrives as a portal-staged tar via FileDownload; results
#     return via DirectoryUpload — no git needed on any remote host.

import json
import os

from buildbot.plugins import (schedulers, steps, util, worker as
                              worker_plugin)

# realpath: master.cfg may be symlinked INTO the master basedir while
# the JSON files live one level up in the buildbot home.
BB_DIR = os.path.dirname(os.path.realpath(__file__))


def _load(name, default):
    try:
        with open(os.path.join(BB_DIR, name)) as fh:
            return json.load(fh)
    except (OSError, ValueError):
        return default


targets = _load("targets.json", {"workers": [], "targets": []})
secrets = _load("secrets.json", {})
worker_passwords = secrets.get("worker_passwords", {})
api_user = secrets.get("api_user", "to-api")
api_password = secrets.get("api_password", "")

c = BuildmasterConfig = {}

# Product requirement: never phone home.
c["buildbotNetUsageData"] = None

# ---------------------------------------------------------------- workers

c["workers"] = [
    worker_plugin.Worker(
        w["name"], worker_passwords.get(w["name"], ""),
        max_builds=w.get("max_builds"))
    for w in targets.get("workers", [])
]

# PB is the only protocol remote workers need — they dial out to it.
c["protocols"] = {"pb": {"port": targets.get(
    "pb_port", "tcp:9989:interface=0.0.0.0")}}

c["change_source"] = []
c["services"] = []

# ------------------------------------------------- per-run renderables

STAGING = targets.get("staging_dir", os.path.join(BB_DIR, "staging"))
ARTIFACTS = targets.get("artifacts_dir",
                        os.path.join(BB_DIR, "artifacts"))


@util.renderer
def _source_tar(props):
    """Portal-staged source archive for this execution (per-run path —
    the portal writes it before submitting the buildrequest)."""
    return os.path.join(STAGING, props.getProperty("to_execution_id")
                        + ".tar")


@util.renderer
def _exec_argv(props):
    """Validated runner spec -> argv list, rendered master-side so the
    worker receives a command list — never a shell string. The spec
    carries executable/args/optional credential-file wrapper paths;
    secrets are never present in properties.
    The argv is wrapped so the CLI's PID lands in .to_exec_pid under
    the builddir: a build RETRYed after worker loss can then resolve
    the interrupted earlier attempt's process before re-staging —
    orphaned CLIs are terminated, never left writing into the same
    Reports/ the retry uploads."""
    spec = json.loads(props.getProperty("exec_spec", "{}"))
    if spec.get("credential_wrapper") and spec.get("credential_file"):
        argv = [spec["credential_wrapper"], spec["credential_file"],
                spec["executable"], *spec.get("args", [])]
    else:
        argv = [spec["executable"], *spec.get("args", [])]
    if spec.get("posix") is False:
        return argv     # Windows workers: no sh, no pidfile contract
    # POSIX workers only (Linux/mac); the wrapper resolves the pidfile
    # relative to the exec workdir so it lands at the builddir root.
    wd = spec.get("exec_workdir") or "build"
    depth = max(0, len([p for p in wd.split("/") if p]) - 1)
    pidfile = "../" * depth + ".to_exec_pid"
    return ["sh", "-c",
            f'echo $$ > "{pidfile}"; exec "$@"',
            "to-exec", *argv]


@util.renderer
def _exec_workdir(props):
    spec = json.loads(props.getProperty("exec_spec", "{}"))
    return spec.get("exec_workdir") or "build"


@util.renderer
def _exec_env(props):
    """Optional extra environment for the exec step (e.g.
    PLAYWRIGHT_JUNIT_OUTPUT_FILE for the JUnit reporter path).
    TO_EXEC_ID is always injected: retry-prep proves an orphaned pid
    belongs to THIS execution's earlier attempt via /proc environ
    before killing it — pid-reuse can never hit an innocent process."""
    spec = json.loads(props.getProperty("exec_spec", "{}"))
    env = dict(spec.get("env") or {})
    env["TO_EXEC_ID"] = str(
        props.getProperty("to_execution_id") or "")
    return env


@util.renderer
def _deps_argv(props):
    """Optional pre-exec step argv (e.g. npm ci for node runners) —
    empty list = step skipped by the conditional below."""
    spec = json.loads(props.getProperty("exec_spec", "{}"))
    return spec.get("deps_argv") or ["true"]


def _has_deps(step):
    spec = json.loads(
        step.build.getProperty("exec_spec") or "{}")
    return bool(spec.get("deps_argv"))


@util.renderer
def _report_src(props):
    spec = json.loads(props.getProperty("exec_spec", "{}"))
    return spec.get("report_src") or "Reports"


@util.renderer
def _prep_argv(props):
    """First step of every build: count this attempt, resolve a prior
    attempt's recorded exec pid, then clean the workspace so only
    THIS build's outputs are uploaded.

    Retry policy (explicit — attempt attribution alone is not a
    policy): the per-execution attempt counter lives in the builddir,
    so Buildbot's automatic resubmit lands here every time.
    ``max_attempts`` / ``retry_enabled`` come from the spec; any
    violation exits 70 with a TO_RETRY_BLOCKED marker the portal maps
    to UNKNOWN (reservations retained for reconciliation).

    Orphan resolution: the pid is killed only when /proc environ
    proves it belongs to this exact execution (TO_EXEC_ID) — and the
    kill is CONFIRMED (procfs gone) before the build proceeds. A live
    pid whose marker cannot be verified — including one whose environ
    is unreadable — blocks the build; the original attempt's liveness
    is then uncertain and relaunch is unsafe."""
    eid = str(props.getProperty("to_execution_id") or "")
    try:
        spec = json.loads(props.getProperty("exec_spec") or "{}")
    except Exception:
        spec = {}
    try:
        max_attempts = int(spec.get("max_attempts") or 3)
    except (TypeError, ValueError):
        max_attempts = 3
    retry_on = "1" if spec.get("retry_enabled", True) else "0"
    script = (
        # Per-execution attempt ledger in the builddir — a resubmitted
        # buildrequest re-enters prep in the same dir. Counters for
        # OTHER executions are stale leftovers, removed.
        "af=.to_exec_attempt_" + eid + "; "
        "for f in .to_exec_attempt_*; do "
        "[ \"$f\" = \"$af\" ] || rm -f \"$f\" 2>/dev/null; done; "
        "n=$(( $(cat \"$af\" 2>/dev/null || echo 0) + 1 )); "
        "echo \"$n\" > \"$af\"; "
        "if [ \"$n\" -gt 1 ]; then "
        "if [ \"" + retry_on + "\" != \"1\" ]; then "
        "echo \"TO_RETRY_BLOCKED: attempt $n — retries disabled "
        "(retry_enabled=false)\"; exit 70; fi; "
        "if [ \"$n\" -gt \"" + str(max_attempts) + "\" ]; then "
        "echo \"TO_RETRY_BLOCKED: attempt $n exceeds "
        "max_attempts=" + str(max_attempts) + "\"; exit 70; fi; "
        "echo \"retry-prep: attempt $n of max_attempts="
        + str(max_attempts) + "\"; fi; "
        "for pf in $(find . -maxdepth 1 -name .to_exec_pid "
        "2>/dev/null); do "
        "pid=$(cat \"$pf\" 2>/dev/null || true); "
        "if [ -n \"$pid\" ] && [ -d \"/proc/$pid\" ]; then "
        "if tr '\\0' ' ' < \"/proc/$pid/environ\" 2>/dev/null "
        "| grep -q 'TO_EXEC_ID=" + eid + "'; then "
        "kill \"$pid\" 2>/dev/null || true; "
        "i=0; while [ -d \"/proc/$pid\" ] && [ $i -lt 3 ]; do "
        "sleep 1; i=$((i+1)); done; "
        "kill -9 \"$pid\" 2>/dev/null || true; "
        "i=0; while [ -d \"/proc/$pid\" ] && [ $i -lt 5 ]; do "
        "sleep 1; i=$((i+1)); done; "
        "if [ -d \"/proc/$pid\" ]; then "
        "echo \"TO_RETRY_BLOCKED: prior attempt pid $pid did not "
        "confirm termination — original state unresolved\"; "
        "exit 70; fi; "
        "echo \"retry-prep: terminated orphaned prior attempt "
        "pid $pid (confirmed dead)\"; "
        "else echo \"TO_RETRY_BLOCKED: pid $pid alive; env marker "
        "mismatch or unreadable — original attempt state "
        "unresolved, relaunch blocked\"; exit 70; fi; "
        "elif [ -n \"$pid\" ]; then "
        "echo \"retry-prep: prior attempt pid $pid already "
        "exited\"; fi; rm -f \"$pf\"; done; "
        "rm -rf source.tar src Reports logs work proj "
        "remote-artifacts")
    return ["sh", "-c", script]


def _posix(step):
    """doStepIf predicate — prep runs only where the pidfile contract
    exists (POSIX workers). Not a renderer: doStepIf is called with
    the step, not rendered."""
    try:
        spec = json.loads(step.getProperty("exec_spec") or "{}")
    except Exception:
        return True
    return spec.get("posix") is not False


@util.renderer
def _artifact_dest(props):
    """Per-attempt artifact dir: a buildrequest retried after worker
    loss uploads under its own buildnumber, so each attempt's reports
    are preserved separately and provenance is attributable."""
    return os.path.join(
        ARTIFACTS, str(props.getProperty("to_execution_id")),
        f"attempt-{props.getProperty('buildnumber') or 'unknown'}")


@util.renderer
def _exec_timeout(props):
    try:
        return int(props.getProperty("exec_timeout") or 7200)
    except (TypeError, ValueError):
        return 7200


@util.renderer
def _ssh_argv(props):
    """Agentless SSH targets: the dispatcher script does connect/exec/
    collect; the spec file path (portal-written, holds no secrets) is
    the single argument. Same pidfile contract as _exec_argv — a
    retryed build terminates an orphaned dispatcher (whose SIGTERM
    handler kills the remote process group)."""
    spec = json.loads(props.getProperty("exec_spec", "{}"))
    argv = [spec["python"], spec["dispatcher_script"],
            spec["spec_file"]]
    if spec.get("posix") is False:
        return argv
    return ["sh", "-c",
            'echo $$ > .to_exec_pid; exec "$@"',
            "to-exec", *argv]


def _kre_factory():
    """Local + remote worker targets: staged source in, validated argv
    run, reports out, workspace cleaned. No git on the worker."""
    f = util.BuildFactory()
    f.addStep(steps.ShellCommand(
        command=_prep_argv, workdir="build",
        name="prep", alwaysRun=True, doStepIf=_posix))
    f.addStep(steps.FileDownload(
        mastersrc=_source_tar, workerdest="source.tar",
        name="fetch-source"))
    f.addStep(steps.ShellCommand(
        command=["tar", "-xf", "source.tar", "-C", "."],
        workdir="build", name="unpack-source"))
    f.addStep(steps.ShellCommand(
        command=_deps_argv, workdir=_exec_workdir, name="deps",
        timeout=1800, logEnviron=False, doStepIf=_has_deps))
    f.addStep(steps.ShellCommand(
        command=_exec_argv, workdir=_exec_workdir,
        name="run", timeout=_exec_timeout, logEnviron=False,
        env=_exec_env))
    f.addStep(steps.DirectoryUpload(
        workersrc=_report_src, masterdest=_artifact_dest,
        name="upload-reports", alwaysRun=True))
    f.addStep(steps.ShellCommand(
        command=["rm", "-rf", "source.tar", "src", "Reports",
                 "logs", "work"],
        workdir="build", name="cleanup", alwaysRun=True))
    return f


def _ssh_factory():
    f = util.BuildFactory()
    f.addStep(steps.ShellCommand(
        command=_prep_argv, workdir="build",
        name="prep", alwaysRun=True, doStepIf=_posix))
    f.addStep(steps.ShellCommand(command=_ssh_argv, name="ssh-run",
                                 env=_exec_env))
    f.addStep(steps.DirectoryUpload(
        workersrc="remote-artifacts", masterdest=_artifact_dest,
        name="upload-artifacts", alwaysRun=True))
    f.addStep(steps.ShellCommand(
        command=["rm", "-rf", "remote-artifacts"], workdir="build",
        name="cleanup", alwaysRun=True))
    return f


# ---------------------------------------------------------------- builds

builder_names = []
builder_cfgs = []
for t in targets.get("targets", []):
    if not t.get("enabled", True):
        continue
    # One builder per admitted dispatch slot: a (builder, worker) pair
    # runs ONE build at a time (shared builddir, WorkerForBuilder.isBusy
    # gates), so max_slots concurrent executions need that many builders
    # on the same worker — each slot builder gets its own builddir.
    slots = max(1, int(t.get("slots") or 1))
    for s in range(slots):
        name = t["builder"] if s == 0 else f"{t['builder']}-s{s + 1}"
        builder_names.append(name)
        builder_cfgs.append(util.BuilderConfig(
            name=name,
            workernames=[t["worker"]],
            factory=_ssh_factory() if t.get("kind") == "ssh"
            else _kre_factory(),
            properties={"to_target_id": t["id"]}))

# A freshly provisioned master has no targets yet (they appear once an
# admin registers execution targets and the portal syncs targets.json).
# Keep a placeholder builder so the config validates and the master
# boots — it's force-scheduled but never forced from the portal.
if not builder_cfgs:
    builder_names.append("to-noop")
    builder_cfgs.append(util.BuilderConfig(
        name="to-noop",
        workernames=["to-local"],
        factory=_kre_factory()))

c["builders"] = builder_cfgs

# ---------------------------------------------------------------- sched

c["schedulers"] = [schedulers.ForceScheduler(
    name="to-force",
    builderNames=builder_names,
    properties=[
        util.StringParameter(name="to_execution_id", size=40),
        util.StringParameter(name="exec_spec", size=20000),
        util.StringParameter(name="exec_timeout", default="7200",
                             size=10),
    ])]

# -------------------------------------------------------------- www/api
# REST API bound to localhost only — the portal's BuildbotAdapter is its
# sole client; the bundled web UI is not a product surface and is never
# proxied by the frontend.

from buildbot.www.auth import UserPasswordAuth  # noqa: E402
from buildbot.www.authz.authz import Authz  # noqa: E402
from buildbot.www.authz.endpointmatchers import (  # noqa: E402
    AnyControlEndpointMatcher, AnyEndpointMatcher)
from buildbot.www.authz.roles import RolesFromUsername  # noqa: E402

c["www"] = dict(
    port=targets.get("www_port",
                     "tcp:8010:interface=127.0.0.1"),
    auth=UserPasswordAuth({api_user: api_password}),
    authz=Authz(
        allowRules=[AnyControlEndpointMatcher(role="api"),
                    AnyEndpointMatcher(role="api", defaultDeny=False)],
        roleMatchers=[RolesFromUsername(usernames=[api_user],
                                        roles=["api"])]))

c["title"] = "TestOrchestrator build master"
c["titleURL"] = targets.get("portal_url", "http://localhost")
c["buildbotURL"] = targets.get("buildbot_url", "http://localhost:8010/")
c["db"] = {"db_url": "sqlite:///state.sqlite"}
