# One workflow run per execution. The step invokes the LOCAL agent,
# which is provisioned with its own token at install time — the token is
# never a workflow param, process arg, or log line.
params:
  - execution_id: ""
steps:
  - name: execute-assigned-task
    command: >-
      python3 -m testorchestrator.agent --once
      --execution-id "$execution_id" --config /etc/testorchestrator/agent.toml
    working_dir: ~
