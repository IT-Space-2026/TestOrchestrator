# TestOrchestrator execution workflow — one run per execution_id.
# Ownership: Dagu coordinates; agent is the authenticated executor.
params:
  - execution_id: ""
  - portal_url: ""
  - agent_token: ""      # injected at submit time; never in this file
steps:
  - name: execute-assigned-task
    command: >-
      python3 -m testorchestrator.agent --portal "$portal_url"
      --token "$agent_token" --once --execution-id "$execution_id"
    dir: ~
